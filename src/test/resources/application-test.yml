spring:
  datasource:
    url: jdbc:h2:mem:blogtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  thymeleaf:
    cache: false

  mail:
    host: localhost
    port: 2525
    username: test
    password: test

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
