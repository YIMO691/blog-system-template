<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('评论审核')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container">
  <h2 class="mb-3">待审核评论</h2>
  <div id="admin-comment-feedback" class="alert d-none"></div>

  <div th:if="${pending.size() == 0}" class="text-muted">暂无待审核评论</div>

  <div th:each="c : ${pending}" class="border rounded p-3 mb-3 pending-comment-card" th:attr="data-comment-id=${c.id}">
    <div class="d-flex justify-content-between">
      <div>
        <strong th:text="${c.displayName}"></strong>
        <span class="text-muted"> · ArticleID=</span><span th:text="${c.article.id}"></span>
      </div>
      <small class="text-muted" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
    </div>
    <div class="mt-2" style="white-space: pre-wrap;" th:text="${c.content}"></div>

    <div class="mt-3 d-flex gap-2">
      <form th:action="@{/admin/comments/{id}/approve(id=${c.id})}" method="post" class="admin-comment-approve-form">
        <button class="btn btn-success btn-sm" type="submit">通过</button>
      </form>
      <form th:action="@{/admin/comments/{id}/delete(id=${c.id})}" method="post" class="admin-comment-delete-form"
            onsubmit="return confirm('确定要删除这条评论吗？')">
        <button class="btn btn-outline-danger btn-sm" type="submit">删除</button>
      </form>
    </div>
  </div>
  <div class="mt-4">
    <a class="btn btn-outline-secondary rounded-pill px-4" th:href="@{/admin}"><i class="bi bi-arrow-left me-1"></i>返回仪表盘</a>
  </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script>
  (function () {
    function getCsrfToken() {
      return document.querySelector('meta[name="_csrf"]')?.getAttribute('content') || null;
    }

    function getCsrfHeaderName() {
      return document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';
    }

    function buildHeaders() {
      const headers = { 'X-Requested-With': 'XMLHttpRequest' };
      const token = getCsrfToken();
      const headerName = getCsrfHeaderName();
      if (token && headerName) {
        headers[headerName] = token;
      }
      return headers;
    }

    function showFeedback(message, level) {
      const box = document.getElementById('admin-comment-feedback');
      if (!box) return;
      box.className = 'alert alert-' + level;
      box.textContent = message;
      box.classList.remove('d-none');
    }

    function bindActionForm(selector, successMessage) {
      document.querySelectorAll(selector).forEach(function (form) {
        form.addEventListener('submit', async function (event) {
          event.preventDefault();
          const card = form.closest('.pending-comment-card');
          const button = form.querySelector('button[type="submit"]');
          if (button) button.disabled = true;
          try {
            const response = await fetch(form.action, {
              method: 'POST',
              headers: buildHeaders()
            });
            const data = await response.json();
            if (!response.ok || !data.ok) {
              throw new Error(data.message || 'action_failed');
            }
            if (card) {
              card.remove();
            }
            showFeedback(successMessage, 'success');
          } catch (error) {
            showFeedback('操作失败，请稍后重试', 'danger');
          } finally {
            if (button) button.disabled = false;
          }
        });
      });
    }

    bindActionForm('.admin-comment-approve-form', '评论已通过');
    bindActionForm('.admin-comment-delete-form', '评论已删除');
  })();
</script>
</body>
</html>
