<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body th:fragment="nav">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-code-slash me-2"></i>Yimo's Blog</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
            aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" th:href="@{/articles}"><i class="bi bi-journal-text me-1"></i>文章</a></li>
        <li class="nav-item" th:if="${currentUser != null and currentUser.canWriteArticles()}">
          <a class="nav-link" th:href="@{/articles/editor/new}"><i class="bi bi-pencil-square me-1"></i>写文章</a>
        </li>
      </ul>

      <form class="d-flex me-3" th:action="@{/articles/search}" method="get" onsubmit="return this.keyword.value.trim() !== ''">
        <div class="input-group">
            <span class="input-group-text bg-light border-0"><i class="bi bi-search"></i></span>
            <input class="form-control border-0" type="search" name="keyword" placeholder="搜索文章..." required>
            <button class="btn btn-light border-0" type="submit">搜索</button>
        </div>
      </form>

      <ul class="navbar-nav">
        <li class="nav-item dropdown me-2" th:if="${#authorization.expression('isAuthenticated()')}">
          <a class="nav-link dropdown-toggle position-relative" href="#" id="noticeDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-bell"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  th:classappend="${notificationsUnread != null and notificationsUnread > 0} ? '' : ' d-none'"
                  th:text="${notificationsUnread != null ? notificationsUnread : 0}">0</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="noticeDropdown" style="min-width: 320px;">
            <li class="nav-notification-empty" th:classappend="${notificationsUnread == null or notificationsUnread == 0} ? '' : ' d-none'">
              <span class="dropdown-item text-muted text-center py-3">暂无未读消息</span>
            </li>
            <li class="nav-notification-item" th:each="n : ${notificationsRecent}" th:if="${!n.read}">
              <div class="dropdown-item d-flex align-items-center py-2 border-bottom">
                <i class="bi me-2 bi-envelope-exclamation-fill text-primary fs-5"></i>
                <div class="flex-grow-1" style="min-width: 0;">
                  <div class="small fw-bold text-truncate" th:text="${n.message}"></div>
                  <div class="d-flex justify-content-between align-items-center mt-1">
                    <span class="small text-muted" style="font-size: 0.75rem;" th:text="${#temporals.format(n.createdAt, 'MM-dd HH:mm')}"></span>
                  </div>
                </div>
              </div>
            </li>
            <li class="nav-notification-read-all" th:classappend="${notificationsUnread != null and notificationsUnread > 0} ? '' : ' d-none'">
              <form th:action="@{/notifications/read-all}" method="post" class="px-3 py-2 text-center bg-light nav-notification-read-all-form">
                <button class="btn btn-sm btn-link text-decoration-none" type="submit">全部标记为已读</button>
              </form>
            </li>
            <li><hr class="dropdown-divider my-0"></li>
            <li>
              <a class="dropdown-item text-center small py-2 bg-light"
                 th:if="${currentUser != null and currentUser.canManageAdminNotifications()}"
                 th:href="@{/admin/notifications}">查看所有通知</a>
              <a class="dropdown-item text-center small py-2 bg-light"
                 th:unless="${currentUser != null and currentUser.canManageAdminNotifications()}"
                 th:href="@{/profile/notifications}">查看所有通知</a>
            </li>
          </ul>
        </li>
        <li class="nav-item dropdown" th:if="${#authorization.expression('isAuthenticated()')}">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle me-1"></i><span id="navCurrentUserName" th:text="${currentUser != null and currentUser.nickname != null and !currentUser.nickname.isBlank() ? currentUser.nickname : #authentication.name}">User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                <li th:if="${currentUser != null and currentUser.canAccessAdmin()}"><a class="dropdown-item" th:href="@{/admin}"><i class="bi bi-speedometer2 me-2"></i>后台管理</a></li>
                <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person-gear me-2"></i>个人中心</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/auth/logout}" method="post" class="d-inline w-100">
                        <button class="dropdown-item text-danger" type="submit"><i class="bi bi-box-arrow-right me-2"></i>退出登录</button>
                    </form>
                </li>
            </ul>
        </li>

        <li class="nav-item" th:if="${#authorization.expression('isAnonymous()')}">
          <a class="btn btn-light text-primary me-2" th:href="@{/auth/login}">登录</a>
        </li>
        <li class="nav-item" th:if="${#authorization.expression('isAnonymous()')}">
          <a class="btn btn-outline-light" th:href="@{/auth/register}">注册</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function () {
    function getCsrfToken() {
      return document.querySelector('meta[name="_csrf"]')?.getAttribute('content') || null;
    }
    function getCsrfHeaderName() {
      return document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || 'X-CSRF-TOKEN';
    }
    function buildHeaders() {
      const headers = { 'X-Requested-With': 'XMLHttpRequest' };
      const token = getCsrfToken();
      const headerName = getCsrfHeaderName();
      if (token && headerName) headers[headerName] = token;
      return headers;
    }
    function updateNavNotifications(unreadCount) {
      const noticeDropdown = document.getElementById('noticeDropdown');
      if (!noticeDropdown) return;
      const badge = noticeDropdown.parentElement.querySelector('.badge');
      const emptyState = document.querySelector('.nav-notification-empty');
      const unreadItems = document.querySelectorAll('.nav-notification-item');
      const readAllRow = document.querySelector('.nav-notification-read-all');
      if (badge) {
        badge.textContent = unreadCount;
        badge.classList.toggle('d-none', unreadCount <= 0);
      }
      unreadItems.forEach(function (item) { item.remove(); });
      if (emptyState) emptyState.classList.toggle('d-none', unreadCount > 0);
      if (readAllRow) readAllRow.classList.toggle('d-none', unreadCount <= 0);
    }
    document.querySelectorAll('.nav-notification-read-all-form').forEach(function (form) {
      if (form.dataset.bound === 'true') return;
      form.dataset.bound = 'true';
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        if (button) button.disabled = true;
        try {
          const response = await fetch(form.action, { method: 'POST', headers: buildHeaders() });
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error('read_all_failed');
          updateNavNotifications(data.data?.unreadCount ?? 0);
        } finally {
          if (button) button.disabled = false;
        }
      });
    });
  })();
</script>
</body>
</html>
