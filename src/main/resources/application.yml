server:
  port: 8080

spring:
  profiles:
    active: dev
  cache:
    type: ${SPRING_CACHE_TYPE:simple}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

app:
  upload:
    dir: ${APP_UPLOAD_DIR:${user.dir}/uploads}
    public-base-url: ${APP_UPLOAD_PUBLIC_BASE_URL:}
    max-size: 5242880
    allowed-extensions:
      - .jpg
      - .jpeg
      - .png
      - .gif
      - .webp
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp

logging:
  file:
    name: ${LOGGING_FILE_NAME:}
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework.web: INFO
    org.springframework.security: INFO
