server:
  error:
    include-message: always
    include-stacktrace: always

spring:
  config:
    import: optional:file:./application-dev.local.yml,optional:file:./config/application-dev.local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  thymeleaf:
    cache: false
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
        debug: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

app:
  flyway:
    repair-on-startup: ${APP_FLYWAY_REPAIR_ON_STARTUP:false}

logging:
  file:
    name: ${LOGGING_FILE_NAME:}
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.thymeleaf: DEBUG
