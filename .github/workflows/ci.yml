name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn -B -ntp test
      - name: Package
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn -B -ntp -DskipTests package
